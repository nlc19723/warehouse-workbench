<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 毛玻璃背景渐变（纯色，无opacity在stop上） -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8E0F6"/>
      <stop offset="35%" stop-color="#7CC4F8"/>
      <stop offset="70%" stop-color="#5AB4F5"/>
      <stop offset="100%" stop-color="#3A9DE8"/>
    </linearGradient>

    <!-- 高光渐变 -->
    <linearGradient id="hlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D0ECFF"/>
      <stop offset="100%" stop-color="#A8D8F5"/>
    </linearGradient>

    <!-- 房子主体 -->
    <linearGradient id="houseBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF5FF"/>
    </linearGradient>

    <!-- 房子底部厚度 -->
    <linearGradient id="houseDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D6EBFB"/>
      <stop offset="100%" stop-color="#B8DAF5"/>
    </linearGradient>

    <!-- 屋顶 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E8F4FE"/>
      <stop offset="100%" stop-color="#CBE6FA"/>
    </linearGradient>

    <!-- 门 -->
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6BB8F6"/>
      <stop offset="100%" stop-color="#4AA3EF"/>
    </linearGradient>

    <!-- 窗户 -->
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D8F0FF"/>
      <stop offset="100%" stop-color="#A8D4F5"/>
    </linearGradient>
  </defs>

  <!-- ========== 纯白背景 ========== -->
  <rect width="512" height="512" rx="115" fill="#FAFBFC"/>

  <!-- ========== 漫反射阴影（用椭圆模拟，不用filter） ========== -->
  <ellipse cx="256" cy="478" rx="180" ry="18" fill="#C9DDF0" opacity="0.55"/>
  <ellipse cx="256" cy="472" rx="150" ry="12" fill="#B8D4EA" opacity="0.35"/>

  <!-- ========== Squircle 毛玻璃底座 ========== -->
  <rect x="22" y="22" width="468" height="468" rx="100" fill="url(#glassBg)"/>

  <!-- 玻璃高光层（左上亮边效果 — 用半透明白色形状叠加） -->
  <rect x="22" y="22" width="468" height="468" rx="100" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.5"/>
  <rect x="22" y="22" width="468" height="468" rx="100" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>

  <!-- 顶部玻璃反光带 -->
  <rect x="32" y="32" width="448" height="135" rx="88" fill="#FFFFFF" opacity="0.14"/>
  <ellipse cx="256" cy="58" rx="155" ry="20" fill="#FFFFFF" opacity="0.20"/>

  <!-- 左侧边缘高光（营造通透体积感） -->
  <rect x="22" y="22" width="60" height="468" rx="100" fill="#FFFFFF" opacity="0.06"/>

  <!-- ========== 白色极简小房子 ========== -->

  <!-- 房子底部阴影/厚度偏移 -->
  <path d="M148 315 L148 372 Q148 382 158 382 L354 382 Q364 382 364 372 L364 315 Z" fill="url(#houseDepth)"/>

  <!-- 房子主体 -->
  <rect x="146" y="222" width="220" height="152" rx="12" fill="url(#houseBody)"/>
  <rect x="146" y="222" width="220" height="152" rx="12" fill="none" stroke="#A8CFEE" stroke-width="1.2" opacity="0.35"/>

  <!-- 屋顶 -->
  <path d="M118 236 Q118 216 136 214 L256 150 L376 214 Q394 216 394 236 L394 242 Q394 252 384 252 L128 252 Q118 252 118 242 Z" fill="url(#roofGrad)"/>
  <!-- 屋顶高光线 -->
  <path d="M136 214 L256 150 L376 214" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M128 244 L384 244" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>
  <!-- 屋顶底边阴影线 -->
  <path d="M118 239 Q256 152 394 239" fill="none" stroke="#90C5E8" stroke-width="1.5" opacity="0.25"/>

  <!-- 门 -->
  <rect x="235" y="306" width="42" height="68" rx="8" fill="url(#doorGrad)"/>
  <rect x="237" y="308" width="17" height="64" rx="6" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="267" cy="342" r="3.5" fill="#FFFFFF" opacity="0.55"/>

  <!-- 左窗 -->
  <rect x="167" y="252" width="40" height="34" rx="6" fill="url(#winGrad)"/>
  <rect x="167" y="252" width="40" height="34" rx="6" fill="none" stroke="#90C5E8" stroke-width="1" opacity="0.3"/>
  <line x1="187" y1="252" x2="187" y2="286" stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
  <line x1="167" y1="269" x2="207" y2="269" stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
  <rect x="169" y="254" width="15" height="12" rx="3" fill="#FFFFFF" opacity="0.35"/>

  <!-- 右窗 -->
  <rect x="305" y="252" width="40" height="34" rx="6" fill="url(#winGrad)"/>
  <rect x="305" y="252" width="40" height="34" rx="6" fill="none" stroke="#90C5E8" stroke-width="1" opacity="0.3"/>
  <line x1="325" y1="252" x2="325" y2="286" stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
  <line x1="305" y1="269" x2="345" y2="269" stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
  <rect x="307" y="254" width="15" height="12" rx="3" fill="#FFFFFF" opacity="0.35"/>

  <!-- 烟囱 -->
  <rect x="321" y="168" width="22" height="40" rx="4" fill="url(#houseDepth)"/>
  <rect x="323" y="170" width="18" height="36" rx="3" fill="#E0F0FD"/>
  <rect x="323" y="170" width="7" height="36" rx="2" fill="#FFFFFF" opacity="0.4"/>
</svg>
