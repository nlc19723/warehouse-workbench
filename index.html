  <!-- 源代码保护（基础防护：禁用右键/F12/查看源码快捷键 + 控制台水印） -->
  <script>
    (function () {
      // 1. 禁用右键菜单
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });

      // 2. 禁用常见调试/查看源码快捷键
      document.addEventListener('keydown', function (e) {
        // F12
        if (e.key === 'F12') { e.preventDefault(); return; }
        // Ctrl+Shift+I / J / C / K（开发者工具）
        if (e.ctrlKey && e.shiftKey && ['I','J','C','K'].includes(e.key.toUpperCase())) {
          e.preventDefault(); return;
        }
        // Ctrl+U（查看源代码）
        if (e.ctrlKey && e.key.toUpperCase() === 'U') { e.preventDefault(); return; }
        // Ctrl+S（保存页面）
        if (e.ctrlKey && e.key.toUpperCase() === 'S') { e.preventDefault(); return; }
      });

      // 3. 禁止文本选择（防简单复制）
      document.addEventListener('selectstart', function (e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        // 允许在数据表格内选择
        if (e.target.closest && e.target.closest('.data-table')) return;
        e.preventDefault();
      });

      // 4. 控制台水印（含版本号）
      const _ver = (window.AppConfig && AppConfig.app && AppConfig.app.version) || 'v???';
      const banner = '\n%c🔒 库管系统工作台 · ' + _ver + ' · 源码受保护\n%c本应用为内部使用版本。未经授权，禁止复制、分发或反编译源码。\n© Warehouse Workbench · All Rights Reserved\n';
      console.log(banner, 'color:#3b82f6;font-size:18px;font-weight:bold;padding:4px 0;', 'color:#64748b;font-size:12px;');
      console.log('%c当前版本：' + _ver + '  ·  如需正式授权或技术支持，请联系管理员。', 'color:#94a3b8;font-size:11px;font-style:italic;');
    })();
  </script>

  <!-- 源代码下载：动态打包当前最新文件（不再使用静态旧 zip） -->
  <!-- 下载需输入密码 1122，每次点击都会要求输入。打包内容与线上版本完全一致。 -->
  <script>
    (function () {
      var overlay = document.getElementById('dlPwOverlay');
      var input   = document.getElementById('dlPwInput');
      var error   = document.getElementById('dlPwError');
      var PW      = '1122';

      // ===== 需要打包的文件清单（相对路径，与项目根目录一致）=====
      var FILES_TO_PACKAGE = [
        'index.html',
        'manifest.json',
        'service-worker.js',
        '.gitignore',
        'css/style.css',
        'js/table-utils.js', 'js/db.js', 'js/config.js', 'js/sync.js', 'js/data-loader.js',
        'js/dashboard.js', 'js/supplier.js', 'js/query.js', 'js/reconciliation.js',
        'js/order-track.js', 'js/inventory-alert.js', 'js/orders.js', 'js/inbound.js',
        'js/stock.js', 'js/pricing.js', 'js/low-turnover.js', 'js/breach.js',
        'js/outbound.js', 'js/app.js', 'js/order-check.js',
        'js/stock-detail.js', 'js/supplier-detail.js', 'js/order-detail.js', 'js/entity-links.js',
        'lib/dexie.min.js', 'lib/chart.min.js', 'lib/xlsx.full.min.js',
        'lib/supabase.min.js', 'lib/jszip.min.js',
        'icons/icon-72.svg','icons/icon-96.svg','icons/icon-128.svg','icons/icon-144.svg',
        'icons/icon-152.svg','icons/icon-192.svg','icons/icon-512.svg','icons/icon-design.svg',
        'icons/icon-72.png','icons/icon-96.png','icons/icon-128.png','icons/icon-144.png',
        'icons/icon-152.png','icons/icon-192.png','icons/icon-512.png',
        '.github/workflows/deploy.yml',
        '.gitlab-ci.yml',
        'releases/app-manifest.json',
        'screenshots/fixed_dashboard.png',
        '.nojekyll'
      ];

      // 权威文件清单：优先从 SOURCE_FILES.json 读取（由 tools/gen-source-list.mjs 扫描生成，
      // 自动包含所有新增/改动的业务文件，避免硬编码清单漏文件）；若清单缺失则回退内置 FILES_TO_PACKAGE。
      async function loadFileList() {
        try {
          const resp = await fetch('SOURCE_FILES.json?' + new Date().getTime()); // 加时间戳防止缓存
          if (!resp.ok) return null;
          const list = await resp.json();
          if (Array.isArray(list) && list.length) {
            console.log('[download] 使用权威清单 SOURCE_FILES.json，共 ' + list.length + ' 个文件');
            return list;
          }
        } catch (e) {
          console.warn('[download] 读取 SOURCE_FILES.json 失败，回退内置清单', e.message);
        }
        return null;
      }

      // CDN 通常屏蔽以 . 开头的文件(返回403)，内嵌其内容作为兜底
      var DOTFILE_FALLBACKS = {
        '.gitignore': '# OS / editor junk\n.DS_Store\nThumbs.db\n*.swp\n\n# Node (not used, but safe)\nnode_modules/\n\n# Local-only / large working assets not needed for the live site\nscreenshots/\n\n# 旧的静态源码包（已被动态打包取代，且含修复前的旧代码，禁止再提交/发布）\nsource-code.zip\n',
        '.github/workflows/deploy.yml': 'name: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: github-pages\n  cancel-in-progress: true\n\njobs:\n  deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Pages\n        uses: actions/configure-pages@v5\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: .\n\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n',
        '.gitlab-ci.yml': '# GitLab Pages 部署配置 —— 把静态文件发布为网站\npages:\n  stage: deploy\n  script:\n    - echo "静态站点，无需构建，直接发布"\n  artifacts:\n    paths:\n      - .\n    expire_in: 1 day\n  rules:\n    - if: $CI_COMMIT_BRANCH == "main"\n',
        '.nojekyll': ''
      };

      // 动态打包：逐个 fetch 当前线上文件 → JSZip 压缩 → 触发下载
      async function doDynamicDownload() {
        if (typeof JSZip === 'undefined') {
          error.textContent = 'JSZip 库未加载，请刷新页面后重试';
          return;
        }
        const baseList = await loadFileList() || FILES_TO_PACKAGE;
        // dotfile（.github/.gitignore/.gitlab-ci.yml/.nojekyll）在部分 CDN 会被屏蔽(403)，
        // 用内嵌兜底内容写入，确保无论用哪种清单都能齐全，不被遗漏。
        const dotKeys = Object.keys(DOTFILE_FALLBACKS);
        const fileList = baseList.concat(dotKeys.filter(function (k) {
          return baseList.indexOf(k) === -1;
        }));
        overlay.classList.remove('show');
        showLoading('正在打包源代码（' + fileList.length + ' 个文件）...', { progress: 0 });

        var zip = new JSZip();
        var fetched = 0;
        var total  = fileList.length;

        Promise.all(fileList.map(function (path) {
          return fetch(path).then(function (resp) {
            if (!resp.ok) {
              // dotfile 被 CDN 屏蔽(403)时，使用内嵌兜底内容
              if (resp.status === 403 && DOTFILE_FALLBACKS[path]) {
                zip.file(path, DOTFILE_FALLBACKS[path]);
                fetched++;
                showLoading('正在打包... (' + fetched + '/' + total + ')', { progress: Math.round(fetched / total * 100) });
                return;
              }
              throw new Error(path + ': HTTP ' + resp.status);
            }
            return resp.blob().then(function (blob) {
              zip.file(path, blob);
              fetched++;
              showLoading('正在打包... (' + fetched + '/' + total + ')', { progress: Math.round(fetched / total * 100) });
            });
          }).catch(function (err) {
            console.warn('[download] 跳过文件:', path, err.message);
            fetched++;
          });
        })).then(function () {
          return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } },
            function (metadata) {
              showLoading('正在压缩... ' + Math.round(metadata.percent) + '%', { progress: Math.round(metadata.percent) });
            });
        }).then(function (blob) {
          hideLoading();
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'warehouse-workbench-source-v' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '.zip';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
          console.log('[download] 源代码打包完成 (' + fetched + '/' + total + ' 文件)');
        }).catch(function (err) {
          hideLoading();
          console.error('[download] 打包失败:', err);
          alert('打包失败: ' + (err.message || err));
        });
      }

      function openDl() {
        overlay.classList.add('show');
        input.value = ''; error.textContent = '';
        setTimeout(function () { try { input.focus(); } catch (e) {} }, 60);
      }
      function closeDl() { overlay.classList.remove('show'); }

      document.getElementById('sourceDownloadBtn').addEventListener('click', function (e) {
        e.preventDefault();
        openDl();
      });
      document.getElementById('dlPwClose').addEventListener('click', closeDl);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) closeDl(); });
      function submit() {
        if (input.value === PW) {
          closeDl();
          doDynamicDownload();
        } else {
          error.textContent = '密码错误，请重试';
          input.value = ''; input.focus();
        }
      }
      document.getElementById('dlPwSubmit').addEventListener('click', submit);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    })();
  </script>
</body>
</html>
