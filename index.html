  <!-- PWA: 注册 Service Worker（支持离线 + 安装为桌面应用） -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        // 🟢 v227.21：注册 URL 带版本戳 + updateViaCache:'none'，确保每次发版浏览器都重新拉取 SW 脚本，
        //   避免「改了 CACHE_NAME 但旧 ?v= 被 CDN 缓存、SW 永不更新」的卡死。
        navigator.serviceWorker.register('service-worker.js?v=228.07', { updateViaCache: 'none' }).then(function(reg) {
          console.log('[PWA] Service Worker 注册成功:', reg.scope);
        }).catch(function(err) {
          console.warn('[PWA] Service Worker 注册失败:', err);
        });
        // 🟢 v227.21：新 SW 接管控制时自动刷新一次，让新版资源立即生效（防「发了版却看不到」）。
        let __swRefreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (__swRefreshing) return;
          __swRefreshing = true;
          location.reload();
        });
      });
    }
  </script>

  <!-- 源代码保护（基础防护：禁用右键/F12/查看源码快捷键 + 控制台水印） -->
  <script>
    (function () {
      // 1. 禁用右键菜单
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });

      // 2. 禁用常见调试/查看源码快捷键
      document.addEventListener('keydown', function (e) {
        // F12
        if (e.key === 'F12') { e.preventDefault(); return; }
        // Ctrl+Shift+I / J / C / K（开发者工具）
        if (e.ctrlKey && e.shiftKey && ['I','J','C','K'].includes(e.key.toUpperCase())) {
          e.preventDefault(); return;
        }
        // Ctrl+U（查看源代码）
        if (e.ctrlKey && e.key.toUpperCase() === 'U') { e.preventDefault(); return; }
        // Ctrl+S（保存页面）
        if (e.ctrlKey && e.key.toUpperCase() === 'S') { e.preventDefault(); return; }
      });

      // 3. 禁止文本选择（防简单复制）
      document.addEventListener('selectstart', function (e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        // 允许在数据表格内选择
        if (e.target.closest && e.target.closest('.data-table')) return;
        e.preventDefault();
      });

      // 4. 控制台水印（含版本号）
      const _ver = (window.AppConfig && AppConfig.app && AppConfig.app.version) || 'v???';
      const banner = '\n%c🔒 库管系统工作台 · ' + _ver + ' · 源码受保护\n%c本应用为内部使用版本。未经授权，禁止复制、分发或反编译源码。\n© Warehouse Workbench · All Rights Reserved\n';
      console.log(banner, 'color:#3b82f6;font-size:18px;font-weight:bold;padding:4px 0;', 'color:#64748b;font-size:12px;');

    })();

  <!-- 源代码下载：动态打包当前最新文件（不再使用静态旧 zip） -->
  <!-- 下载需输入密码 1122，每次点击都会要求输入。打包内容与线上版本完全一致。 -->
  <script>
    (function () {
      var overlay = document.getElementById('dlPwOverlay');
      var input   = document.getElementById('dlPwInput');
      var error   = document.getElementById('dlPwError');
      var PW      = '1122';

      // ===== 需要打包的文件清单（相对路径，与项目根目录一致）=====
      // 🟢 v227.89：兜底清单与 SOURCE_FILES.json 同步：新增 filter-layout.js / stocktake-batch.js，
      //   移除已删除的 css/style.css.bak-css501（旧备份，根目录已无此文件）。
      // 优先路径仍是动态目录扫描（沙箱/常规 http server 支持），此清单仅在 GH Pages 等
      // 不支持目录列表的部署环境作为回退兜底。
      var FILES_TO_PACKAGE = [
        'index.html',
        'manifest.json',
        'service-worker.js',
        '.gitignore',
        'css/style.css',
        'docs/全局代码审查标准.md',
        'bridge/decrypt_bridge.py', 'bridge/dump_one.py', 'bridge/start_bridge.bat',
        'bridge/test_bridge.py', 'bridge/README.md', 'bridge/FRONTEND_INTEGRATION.md',
        'js/table-utils.js', 'js/db.js', 'js/config.js', 'js/sync.js', 'js/data-loader.js',
        'js/dashboard.js', 'js/supplier.js', 'js/query.js', 'js/reconciliation.js',
        'js/order-track.js', 'js/inventory-alert.js', 'js/orders.js', 'js/inbound.js',
        'js/stock.js', 'js/pricing.js', 'js/low-turnover.js', 'js/breach.js',
        'js/outbound.js', 'js/app.js', 'js/order-check.js',
        'js/stock-detail.js', 'js/supplier-detail.js', 'js/order-detail.js', 'js/entity-links.js',
        'js/stocktake.js', 'js/stocktake-batch.js', 'js/stocktake-records.js',
        'js/filter-layout.js', 'js/globals.js', 'js/color-theme.js', 'js/modal.js',
        'js/qr-scan.js', 'js/qr-util.js', 'js/search-select.js', 'js/import-worker.js',
        'js/components/datepicker.js',
        'lib/dexie.min.js', 'lib/chart.min.js', 'lib/xlsx.full.min.js',
        'lib/supabase.min.js', 'lib/jszip.min.js', 'lib/zxing.min.js',
        'lib/jsqr.min.js', 'lib/qrcode.min.js',
        'icons/icon-72.svg','icons/icon-96.svg','icons/icon-128.svg','icons/icon-144.svg',
        'icons/icon-152.svg','icons/icon-192.svg','icons/icon-512.svg','icons/icon-design.svg',
        'icons/icon-72.png','icons/icon-96.png','icons/icon-128.png','icons/icon-144.png',
        'icons/icon-152.png','icons/icon-192.png','icons/icon-512.png',
        '.github/workflows/deploy.yml',
        '.gitlab-ci.yml',
        'releases/app-manifest.json',
        '.nojekyll'
      ];

      // ===== 动态清单：优先用「目录列表扫描」实时获取当前部署的所有源码文件 =====
      // 这样以后新增任何文件，无需手动更新 SOURCE_FILES.json，下载的源码包都会自动包含。
      // 仅当服务器不支持目录列表（如 GitHub Pages）时，才回退到 SOURCE_FILES.json / 内置清单。
      var SCAN_ROOTS = ['js', 'lib', 'css', 'icons', 'bridge', 'docs'];
      var SKIP_DIRS  = new Set(['node_modules', '.git', 'tools', 'scripts', 'releases']);
      var ROOT_FILES = ['index.html', 'manifest.json', 'service-worker.js',
                        '.gitignore', '.gitlab-ci.yml', '.nojekyll', 'SOURCE_FILES.json',
                        '.github/workflows/deploy.yml', 'releases/app-manifest.json'];
      // 排除「根目录级别」的临时报告/草稿（如 全局代码审查报告_v227.50.md、UI优化方案.md 等），
      // 但【保留 docs/ 与 bridge/ 下的文档】——含《全局代码审查标准.md》及 bridge 的 README/集成说明。
      // 参数传相对路径（含目录），以区分根级垃圾与子目录里的正式文档。
      function _isDevJunk(relPath) {
        var base = relPath.indexOf('/') >= 0 ? relPath.split('/').pop() : relPath;
        if (/^(dp-|settings-verify)/.test(base) || base.endsWith('_preview.html')) return true;
        // 仅当 .md 位于仓库根目录时才视为垃圾；docs/、bridge/ 下的 .md 一律保留
        if (base.endsWith('.md') && relPath.indexOf('/') === -1) return true;
        return false;
      }
      // 仅在「目录扫描」路径下排除无用图片：保留 manifest 引用的 PWA 图标
      // (icons/icon-<size>.png|svg)，排除设计稿/预览/截图/草稿类图片（如 icon-design.svg）。
      function _isUselessImage(name) {
        var lower = name.toLowerCase();
        if (!/\.(png|jpe?g|gif|webp|svg)$/.test(lower)) return false;
        return /\bdesign\b|preview|screenshot|_bak|mock|draft|tmp|^v\d/i.test(lower);
      }
      async function _listDirEntries(relDir) {
        try {
          var resp = await fetch(relDir + (relDir.endsWith('/') ? '' : '/') + '?_=' + Date.now());
          if (!resp.ok) return null;
          var html = await resp.text();
          var out = [], re = /<a\s+href="([^"]+)"/gi, m;
          while ((m = re.exec(html))) {
            var h = decodeURIComponent(m[1]);
            if (h === '../' || h.charAt(0) === '/' || /^https?:/i.test(h)) continue;
            out.push(h);
          }
          return out;
        } catch (e) { return null; }
      }
      async function _scanRecursive(relDir) {
        var entries = await _listDirEntries(relDir);
        if (!entries) return [];
        var files = [], base = relDir === '' ? '' : relDir + '/';
        for (var i = 0; i < entries.length; i++) {
          var e = entries[i];
          if (e.charAt(e.length - 1) === '/') {
            var dirName = e.slice(0, -1);
            if (SKIP_DIRS.has(dirName) || dirName.charAt(0) === '.') continue;
            files = files.concat(await _scanRecursive(base + dirName));
          } else {
            if (e.charAt(0) === '.' || _isDevJunk(base + e) || _isUselessImage(e)) continue;
            files.push(base + e);
          }
        }
        return files;
      }
      async function scanSourceDirs() {
        var files = [];
        for (var i = 0; i < SCAN_ROOTS.length; i++) {
          files = files.concat(await _scanRecursive(SCAN_ROOTS[i]));
        }
        files = files.concat(ROOT_FILES);
        return files;
      }
      // 两份必备文档：任何回退路径都强制纳入，避免被目录扫描的 _isDevJunk 把根级 .md（纪律文档）误剔
      var REQUIRED_DOCS = ['docs/全局代码审查标准.md', '修复与发布纪律_v227.92.md'];

      async function buildPackageList() {
        // 🟢 v228.03 修复：优先用 package-source.mjs 生成的权威清单 SOURCE_FILES.json，
        // 它与「源码下载」交付包完全一致（全部代码 + 两份文档 + 有用图标，其余剔除）。
        // 不再优先目录扫描——目录扫描在部分托管可用，但会把根级 .md（纪律文档）误剔，导致下载缺文档。
        var sl = await loadFileList();
        if (sl && sl.length) {
          console.log('[download] 使用权威清单 SOURCE_FILES.json，共 ' + sl.length + ' 个文件');
          return sl;
        }
        // 回退①：动态目录扫描（实时），强制补入两份必备文档
        try {
          var dyn = await scanSourceDirs();
          if (dyn && dyn.length) {
            for (var k = 0; k < REQUIRED_DOCS.length; k++) {
              if (dyn.indexOf(REQUIRED_DOCS[k]) === -1) dyn.push(REQUIRED_DOCS[k]);
            }
            console.log('[download] 目录扫描回退，共 ' + dyn.length + ' 个文件（已补入两份必备文档）');
            return dyn;
          }
        } catch (e) { console.warn('[download] 目录扫描失败', e.message); }
        // 回退②：内置硬编码清单（同样补入两份文档）
        var fb = FILES_TO_PACKAGE.slice();
        for (var m = 0; m < REQUIRED_DOCS.length; m++) {
          if (fb.indexOf(REQUIRED_DOCS[m]) === -1) fb.push(REQUIRED_DOCS[m]);
        }
        return fb;
      }
      // 权威清单：由 tools/gen-source-list.mjs 扫描生成，作为目录列表不可用时的回退。
      async function loadFileList() {
        try {
          const resp = await fetch('SOURCE_FILES.json?' + new Date().getTime()); // 加时间戳防止缓存
          if (!resp.ok) return null;
          const list = await resp.json();
          if (Array.isArray(list) && list.length) {
            console.log('[download] 使用权威清单 SOURCE_FILES.json，共 ' + list.length + ' 个文件');
            return list;
          }
        } catch (e) {
          console.warn('[download] 读取 SOURCE_FILES.json 失败，回退内置清单', e.message);
        }
        return null;
      }

      // CDN 通常屏蔽以 . 开头的文件(返回403)，内嵌其内容作为兜底
      var DOTFILE_FALLBACKS = {
        '.gitignore': '# OS / editor junk\n.DS_Store\nThumbs.db\n*.swp\n\n# Node (not used, but safe)\nnode_modules/\n\n# Local-only / large working assets not needed for the live site\nscreenshots/\n\n# 旧的静态源码包（已被动态打包取代，且含修复前的旧代码，禁止再提交/发布）\nsource-code.zip\n',
        '.github/workflows/deploy.yml': 'name: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: github-pages\n  cancel-in-progress: true\n\njobs:\n  deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Pages\n        uses: actions/configure-pages@v5\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: .\n\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n',
        '.gitlab-ci.yml': '# GitLab Pages 部署配置 —— 把静态文件发布为网站\npages:\n  stage: deploy\n  script:\n    - echo "静态站点，无需构建，直接发布"\n  artifacts:\n    paths:\n      - .\n    expire_in: 1 day\n  rules:\n    - if: $CI_COMMIT_BRANCH == "main"\n',
        '.nojekyll': ''
      };

      // 动态打包：逐个 fetch 当前线上文件 → JSZip 压缩 → 触发下载
      async function doDynamicDownload() {
        if (typeof JSZip === 'undefined') {
          error.textContent = 'JSZip 库未加载，请刷新页面后重试';
          return;
        }
        const baseList = await buildPackageList();
        // dotfile（.github/.gitignore/.gitlab-ci.yml/.nojekyll）在部分 CDN 会被屏蔽(403)，
        // 用内嵌兜底内容写入，确保无论用哪种清单都能齐全，不被遗漏。
        const dotKeys = Object.keys(DOTFILE_FALLBACKS);
        const fileList = baseList.concat(dotKeys.filter(function (k) {
          return baseList.indexOf(k) === -1;
        }));
        overlay.classList.remove('show');
        showLoading('正在打包源代码（' + fileList.length + ' 个文件）...', { progress: 0 });

        var zip = new JSZip();
        var fetched = 0;
        var total  = fileList.length;

        Promise.all(fileList.map(function (path) {
          // 🟢 v228.03 修复：加时间戳破坏缓存，确保 CDN / Service Worker 永远返回最新文件，
          // 否则可能下载到「戳新文件旧」的旧 data-loader.js（恢复上一份/云端恢复按钮未合并）。
          var url = path + (path.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
          return fetch(url).then(function (resp) {
            if (!resp.ok) {
              // dotfile 被 CDN 屏蔽(403)时，使用内嵌兜底内容
              if (resp.status === 403 && DOTFILE_FALLBACKS[path]) {
                zip.file(path, DOTFILE_FALLBACKS[path]);
                fetched++;
                showLoading('正在打包... (' + fetched + '/' + total + ')', { progress: Math.round(fetched / total * 100) });
                return;
              }
              throw new Error(path + ': HTTP ' + resp.status);
            }
            return resp.blob().then(function (blob) {
              zip.file(path, blob);
              fetched++;
              showLoading('正在打包... (' + fetched + '/' + total + ')', { progress: Math.round(fetched / total * 100) });
            });
          }).catch(function (err) {
            console.warn('[download] 跳过文件:', path, err.message);
            fetched++;
          });
        })).then(function () {
          return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } },
            function (metadata) {
              showLoading('正在压缩... ' + Math.round(metadata.percent) + '%', { progress: Math.round(metadata.percent) });
            });
        }).then(function (blob) {
          hideLoading();
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'warehouse-workbench-source-v' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '.zip';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
          console.log('[download] 源代码打包完成 (' + fetched + '/' + total + ' 文件)');
        }).catch(function (err) {
          hideLoading();
          console.error('[download] 打包失败:', err);
          alert('打包失败: ' + (err.message || err));
        });
      }

      // 🟢 v227.35：源码下载统一纳入管理员权限（与「数据导入 / 设置」一致，使用同一管理员密码校验）
      // 🟢 v227.39：4 个系统入口统一改为按权限放行（不再强制要求管理员特权；keeper 单独勾选「源码」权限即可）
      window.__startSourceDownload = doDynamicDownload;
      document.getElementById('sourceDownloadBtn').addEventListener('click', function (e) {
        e.preventDefault();
        if (typeof App !== 'undefined' && App.openSourceEntry) {
          App.openSourceEntry();
        } else {
          doDynamicDownload();
        }
      });
    })();
  </script>
