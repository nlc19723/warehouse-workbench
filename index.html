       已加：object-src 'none'（禁插件注入）、base-uri 'self'（禁 <base> 劫持）、
       worker-src 'self' blob:（blob: 用于内联启动动画 worker，源码随页面同源下发，非第三方）、connect-src 锁定 Supabase 域名、img/font 收窄；

<style>
/* 关键 CSS：首屏内联，由 tools/gen-critical-css.mjs 从 css/style.css 自动生成，请勿手改 */
:root{
  /* 背景与光晕 */
  --bg-primary: #F0F4F8;
  --bg-aurora-1: rgba(148, 200, 220, 0.18);
  --bg-aurora-2: rgba(167, 180, 220, 0.15);

  --bg-noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");

  /* 卡片 */
  /* 🟢 v228.08 P1-7：模糊半径下调后，提高卡片底色不透明度作补偿，
     避免背后内容透出影响文字可读性（磨砂感略减，但可读性不降级）。 */
  --card-bg: rgba(255,255,255,0.82);
  --card-bg-hover: rgba(255,255,255,0.85);
  --card-border: rgba(255,255,255,0.8);
  --card-shadow: 0 4px 24px rgba(31,38,135,0.06);
  --card-shadow-hover: 0 8px 36px rgba(31,38,135,0.10);

  /* 🟢 v228.68：语义表面变量（供内联 style 的 var(--bg-card,#fff) 等引用）。
     此前暗色主题未定义这些变量，导致大量内联 var(--bg-card,#fff) 在暗色下回退成纯白。
     这里在亮/暗两套都显式声明，使内联样式随主题切换。 */
  --bg-card: #ffffff;
  --border-color: #e5e7eb;
  --bg-input: #f3f4f6;
  --text-secondary: #5A6B7F;

  /* 🟢 v185：标题行改为冰川蓝渐变（D' 方案），变量跟随主调 */
  --thead-bg: #5e9ad0;

  /* 侧边栏/弹窗（🟢 v186-B：深青+暖橙方案） */
  --panel-bg: #ffffff;
  --panel-border: rgba(0,78,102,0.10);
  --panel-teal: #004E66;
  --panel-teal-light: #51a3bc;
  --panel-orange: #ff5f2e;

  /* 文字 */
  --text-main: #1E293B;
  /* 🟢 v228.24 B-2：--text-body 原 #64748B 在斑马纹行(rgba(220,232,242,.55))上仅 4.22:1，12px 不达标；
     加深至 #5A6B7F（白底 5.46:1 / 斑马行 4.84:1） */
  --text-body: #5A6B7F;
  /* 🟢 v228.24 B-2：原 #94A3B8 在白底仅 2.56:1（KPI 标签/空态/分页数字全站命中，WCAG AA 失败）；
     加深至 #5A6B7F ≈5.1:1。⚠️ 此为权威定义（style.css 后于 index.html 内联 <style> 加载，故此处生效） */
  --text-muted: #5A6B7F;
  --text-inverse: #FFFFFF;

  /* 主色调（冰川蓝） */
  --primary: #5B9BD5;
  --primary-light: #93C5FD;
  --primary-deep: #3B82C4;
  --primary-glow: rgba(91,155,213,0.3);

  /* 强调色 */
  --accent-mint: #6DBF9F;
  --accent-mint-light: rgba(109,191,159,0.15);
  --accent-coral: #D49595;
  --accent-coral-light: rgba(212,149,149,0.15);
  --accent-lavender: #A78BFA;
  --accent-lavender-light: rgba(167,139,250,0.15);
  --accent-warm: #D4A870;
  --accent-warm-light: rgba(212,168,112,0.15);

  /* 状态色（🟢 v227.32：提饱和，解决莫兰迪低对比——小字号/移动端看不清的问题；与深色主题对齐） */
  /* 🟢 v228.24 B-2：danger 文字色由 #E5484D（白底 3.91:1 / 斑马行 3.47:1，12px 不达标）加深至 #C62828
     （白底 5.62:1 / 斑马行 4.99:1）。该令牌在明色主题下仅作前景文字（背景用 -bg 变量），加深不影响实心填充观感。 */
  --status-danger: #C62828;
  --status-danger-bg: rgba(198,40,40,0.12);
  /* 🟢 v228.24 B-2：warning/success 同因「作前景文字」而加深（原 #F59E0B 仅 2.15:1、#16A34A 仅 3.30:1）
     → #B45309（5.02:1）/ #15803D（5.02:1）。背景态仍由 -bg 变量承担，不影响徽标/进度条观感。 */
  --status-warning: #A04708;
  --status-warning-bg: rgba(160,71,8,0.14);
  --status-success: #15803D;
  --status-success-bg: rgba(21,128,61,0.12);
  --status-info: #2563EB;
  --status-info-bg: rgba(37,99,235,0.12);

  /* 毛玻璃
     🟢 v228.08 性能优化 P1-7：模糊半径 20px/10px → 8px/6px。
     backdrop-filter 的 GPU 开销与模糊半径近似平方关系，20~24px 的重磨砂在低端机/移动端
     滚动与弹窗动画时明显掉帧。降到 8px 后磨砂感基本保留（配合卡片背景不透明度上调作补偿），
     合成开销大幅下降。 */
  --glass-blur: blur(8px) saturate(150%);
  --glass-blur-light: blur(6px) saturate(140%);

  /* 滚动条（🟢 v190：加宽到 12px，轨道透明+内边距留白，滑块用冰川蓝半透，hover 加深） */
  --scrollbar-thumb: rgba(91,155,213,0.35);
  --scrollbar-thumb-hover: rgba(91,155,213,0.55);
  --scrollbar-track: transparent;
  --scrollbar-width: 12px;
  --scrollbar-thumb-w: 10px;

  /* 🟢 v227.53：侧栏面板/头部/按钮底色（默认浅色态） */
  --sidebar-panel-bg-top: #ffffff;
  --sidebar-panel-bg-bottom: #f3f9fb;
  --sidebar-header-bg-top: #f4fafa;
  --sidebar-header-bg-bottom: #ffffff;
  --sidebar-toggle-bg: #f4fafa;

  /* 圆角 */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-xl: 28px;

  /* 布局 */
  --header-height: 56px;
  --sidebar-width: 240px;
  --content-gap: 14px;

  /* 过渡 */
  --theme-transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*{ margin: 0; padding: 0; box-sizing: border-box; }

html, body{
  width: 100%; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  font-size: 14px;
  color: var(--text-main);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-overflow-scrolling: touch;
  transition: color var(--theme-transition);
}

body{
  background: var(--bg-primary);
  transition: background var(--theme-transition);
}

.loading-overlay{
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-primary);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 1000; transition: opacity 0.3s;
}
.loading-spinner{
  width: 40px; height: 40px; border: 3px solid rgba(122,156,165,0.12);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to{ transform: rotate(360deg); }}
.loading-text{ margin-top: 14px; font-size: 13px; color: var(--text-body); font-weight: 500; }
/* 🟢 v228.22：加载副文案 + 跳过按钮（B-1 修复：打底/同步长时间不结束时的逃生口） */
.loading-sub{ margin-top: 10px; font-size: 12.5px; color: var(--text-muted); line-height: 1.5; max-width: 280px; text-align: center; }
.loading-actions{ margin-top: 18px; display: flex; gap: 10px; justify-content: center; }
.loading-skip-btn{ font-size: 13px; padding: 8px 16px; cursor: pointer; }
/* 🟢 v228.22 B-3：内置示例数据提示横幅（让用户区分演示数据与真实数据） */
.demo-data-banner{
  margin:0 0 12px; padding:10px 14px; border-radius:10px;
  background:rgba(245,158,11,0.12); border:1px solid rgba(245,158,11,0.35);
  color:#92400e; font-size:12.5px; line-height:1.5;
}
.demo-data-banner b{ color:#b45309; }
[data-theme="dark"] .demo-data-banner{ background:rgba(245,158,11,0.16); color:#fcd34d; border-color:rgba(245,158,11,0.40); }
[data-theme="dark"] .demo-data-banner b{ color:#fbbf24; }

  /* 🟢 v229.45：启动加载屏 BootSplash —— 样式【全部内联】且【默认即显示】。
     修复裸 HTML 闪现：此前 #bootSplash 默认 display:none，要等 defer 的 boot-splash.js
     加 is-active 才显示；而 style.css 为异步非阻塞加载 —— 慢网下「JS 未执行 + CSS 未生效」
     的窗口期整页以无样式渲染。现在解析到 <body> 第一帧就是完整启动屏（fixed 全屏不透明），
     物理上盖住主内容，不依赖任何外部资源时序。 */
  #bootSplash{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:1;
    background:
      radial-gradient(120% 90% at 28% 12%, #FFFFFF 0%, rgba(255,255,255,0) 46%),
      radial-gradient(130% 100% at 78% 88%, #E0F7FA 0%, rgba(224,247,250,0) 55%),
      linear-gradient(158deg, #F8F9FA 0%, #E0F7FA 100%);
    font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  #bootSplash.is-active{display:flex;}
  #bootSplash.is-leaving{opacity:0;transition:opacity .52s ease;}
  /* 极光柔光 */
  #bootSplash .boot-aurora{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;pointer-events:none;}
  #bootSplash .ba1{width:340px;height:340px;left:-90px;top:-70px;background:radial-gradient(circle,#FFFFFF 0%,rgba(255,255,255,0) 70%);animation:bootDr1 17s ease-in-out infinite;}
  #bootSplash .ba2{width:300px;height:300px;right:-80px;top:28%;background:radial-gradient(circle,#B2EBF2 0%,rgba(178,235,242,0) 70%);animation:bootDr2 21s ease-in-out infinite;}
  #bootSplash .ba3{width:360px;height:360px;left:-60px;bottom:-110px;background:radial-gradient(circle,#E0F7FA 0%,rgba(224,247,250,0) 70%);animation:bootDr3 25s ease-in-out infinite;}
  @keyframes bootDr1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,26px)}}
  @keyframes bootDr2{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,22px)}}
  @keyframes bootDr3{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,-20px)}}
  #bootSplashCanvas{position:absolute;inset:0;pointer-events:none;z-index:1;}
  /* 🟢 v229.54：worker 模式把 canvas 提到圆盘之上，只用于绘制「实时进度弧 + 中心数字 + 加载中」，
     让这两项在主线程被 DataLoader 冻结时仍流畅爬升；圆盘底/纸雕环质感仍由 DOM/SVG 原样呈现。
     DOM 的「加载中」+数字隐藏（避免与 canvas 重影），粒子/词标本就在 canvas 上、随 worker 独立线程动画。 */
  #bootSplash.worker-mode #bootSplashCanvas{z-index:4;}
  #bootSplash.worker-mode .boot-center .cap,
  #bootSplash.worker-mode .boot-center .num{display:none;}
  /* 四角取景框角标 */
  #bootSplash .boot-corner{position:absolute;width:26px;height:26px;border:1.5px solid rgba(0,168,150,0.20);pointer-events:none;z-index:3;}
  #bootSplash .boot-corner.tl{left:26px;top:26px;border-right:none;border-bottom:none;border-top-left-radius:6px;}
  #bootSplash .boot-corner.tr{right:26px;top:26px;border-left:none;border-bottom:none;border-top-right-radius:6px;}
  #bootSplash .boot-corner.bl{left:26px;bottom:26px;border-right:none;border-top:none;border-bottom-left-radius:6px;}
  #bootSplash .boot-corner.br{right:26px;bottom:26px;border-left:none;border-top:none;border-bottom-right-radius:6px;}
  /* 顶部装饰行 */
  #bootSplash .boot-topdeco{position:absolute;left:0;right:0;top:8.1%;display:flex;align-items:center;justify-content:center;gap:12px;z-index:3;}
  #bootSplash .boot-topdeco::before{content:'';width:44px;height:1px;background:linear-gradient(90deg,rgba(0,168,150,0),rgba(0,168,150,0.30));}
  #bootSplash .boot-topdeco::after{content:'';width:44px;height:1px;background:linear-gradient(270deg,rgba(0,168,150,0),rgba(0,168,150,0.30));}
  #bootSplash .boot-topdeco .dm{width:5px;height:5px;transform:rotate(45deg);background:rgba(0,168,150,0.35);}
  /* 圆环（168px，与设计原型一致） */
  #bootSplash .boot-ring{position:absolute;left:50%;top:var(--cy-ring,50%);transform:translate(-50%,-50%);width:168px;height:168px;z-index:2;}
  #bootSplash .boot-ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  #bootSplash .boot-slice{opacity:0;transition:opacity .3s ease;}
  #bootSplash .boot-slice.on{opacity:1;}
  /* 中心数字 */
  #bootSplash .boot-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:63%;height:63%;border-radius:50%;z-index:3;
    background:#EBF3F1;box-shadow:inset 7px 8px 13px rgba(126,154,150,0.55),inset -6px -7px 12px rgba(255,255,255,0.95);
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #bootSplash .boot-center .cap{font-size:12px;font-weight:400;letter-spacing:.18em;color:#5A6F6B;text-indent:.18em;}
  #bootSplash .boot-center .num{font-size:28px;font-weight:700;line-height:1;color:#0E4D47;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;}
  #bootSplash .boot-center .num .pct{font-size:19px;margin-left:1px;}
  /* 副文案 */
  #bootSplash .boot-sub{position:absolute;left:0;right:0;top:var(--cy-sub,60%);text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:12px;font-weight:400;color:rgba(0,168,150,0.85);z-index:3;transition:opacity .5s ease;}
  #bootSplash .boot-sub::before,#bootSplash .boot-sub::after{content:'';width:16px;height:1px;background:rgba(0,168,150,0.35);}
  #bootSplash .boot-sub span{letter-spacing:.3em;margin-right:-.3em;}
  /* 底部：--progress 进度线 + 版本行 */
  #bootSplash .boot-bottom{position:absolute;left:0;right:0;top:var(--cy-bottom,86%);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:3;}
  #bootSplash .boot-loadline{position:relative;width:150px;height:2px;border-radius:2px;background:rgba(0,168,150,0.12);overflow:hidden;}
  #bootSplash .boot-loadline::after{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;border-radius:2px;
    background:linear-gradient(90deg,rgba(0,168,150,0),rgba(0,168,150,0.45),rgba(0,168,150,0));animation:bootSweep 2.2s ease-in-out infinite;}
  @keyframes bootSweep{0%{left:-40%}62%,100%{left:100%}}

  /* 暗色主题 */

.loading-seg{ position: relative; width: min(360px, 70vw); height: 16px;

.loading-seg::after{ content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 100%;

.truck-gfx{ animation: truckBob .5s ease-in-out infinite; }

  // 原因：弧从 12 点顺时针扫，而 SVG 切片从 12 点逆时针点亮——两者方向相反、永不重叠，
  // 弧永远悬在切片暗区，视觉上像「多出一根线」。进度指示以原装切片环为准，
  // 主线程冻结期间由 Canvas 数字（drawNumber）继续爬升，不再需要第二根进度线。

  // 中心数字（在 worker 线程绘制，主线程被 DataLoader 冻结时数字照常爬升，杜绝「卡在40%」）
  // 圆盘底/阴浮雕/「加载中」纸雕质感仍由 DOM .boot-center 原样渲染（worker 模式下隐藏其 DOM 数字避免重影）
  function drawNumber(p) {
    var x = cx, y = cyCenter;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // 文案「加载中」
    ctx.fillStyle = theme === 'dark' ? 'rgba(143,176,170,0.92)' : 'rgba(90,111,107,0.92)';
    ctx.font = '400 12px ' + FONT_STACK;
    ctx.fillText('加载中', x, y - 22);
    // 中心数字
    var pct = Math.round(p);
    ctx.fillStyle = theme === 'dark' ? '#7fd8c4' : '#0E4D47';
    ctx.font = '700 28px ' + FONT_STACK;
    var numW = ctx.measureText(String(pct)).width;
    var pctW = ctx.measureText('%').width;
    var totalW = numW + pctW;
    var nx = x - totalW / 2;
    ctx.fillText(String(pct), nx + numW / 2, y + 4);
    ctx.font = '400 19px ' + FONT_STACK;
    ctx.fillText('%', nx + numW + pctW / 2, y + 4);
  }

  function tick(nowArg) {
    if (killed) return;
    try {
    var now = (typeof nowArg === 'number' && isFinite(nowArg)) ? nowArg : performance.now();
    if (!lastTick) lastTick = now;
    var dt = Math.min(0.05, (now - lastTick) / 1000);
    lastTick = now;
    time = now / 1000;

    // 缓动 displayed → target
    var tn = clamp((now - tStart) / tDur, 0, 1);
    var eased = lerp(fromVal, toVal, easeOutCubic(tn));
    // 自驱动爬行：target 久未前进且未完成 → 缓慢爬向 90% 封顶（不低于 eased 避免回退）
    var stalled = (!completed && target > 0 && target < 100 && now - lastTargetTime > STALL_MS);
    if (stalled) {
      displayed = Math.max(eased, Math.min(92, displayed + CREEP_SPEED * dt));
    } else {
      displayed = eased;
    }

    // complete 收口：到 100% 后停留 HOLD → 回传 done
    if (completed && displayed >= 99.5 && !donePosted) {
      if (now - completeAt >= HOLD) { donePosted = true; self.postMessage({ type: 'done' }); }
    }

    // ---- 绘制 ----
    ctx.clearRect(0, 0, W, H);
    var p = displayed / 100;
    var gA = p > 0.94 ? clamp(1 - (p - 0.94) / 0.06, 0, 1) : 1;
    var paMul = 1 - clamp((p - 0.62) / 0.38, 0, 1) * 0.85;
    // 🟢 v229.73「潮汐」卡顿姿态：仅用于粒子运动层，不影响圆环/数字/词标/光池/环境尘。
    //   stall：距上次进度更新的静默时长→ 0..1（0.4s 起收拢，2.0s 达屏息）；照抄下方 stalled 的 target>0 / completed 前置，
    //   避免"进度尚未上报"（lastTargetTime 初值 0）时误判为卡顿。
    var tnStall = 0;
    if (!completed && target > 0 && lastTargetTime > 0) tnStall = clamp((now - lastTargetTime - 400) / 1600, 0, 1);
    // pulse：进度刚恢复的瞬间绽放脉冲（45ms 内起跳，750ms 内衰减完）
    var tnPulse = 0;
    if (lastTargetTime > 0) {
      var tnSince = now - lastTargetTime;
      if (tnSince >= 0 && tnSince < 45) tnPulse = Math.sin(clamp((45 - tnSince) / 750, 0, 1) * Math.PI);
    }
    var convEnd = easeInOutCubic(clamp((p - 0.58) / 0.30, 0, 1));
    var breathe = 1 + 0.035 * Math.sin(time * 0.7);
    var breathA = 1 + 0.10 * Math.sin(time * 0.7);
    var poolSwell = 1;
    if (p > 0.88) { var bt = clamp((p - 0.88) / 0.12, 0, 1); poolSwell = 1 + 0.12 * Math.sin(bt * Math.PI); }

    drawLightPool(breathe * poolSwell);
    drawAmbient();
    drawFlatWord(convEnd, convEnd);

    for (var i = 0; i < particles.length; i++) {
      var pt = particles[i];
      var e = convFactor(p, pt);
      // 🟢 v229.73「潮汐」：位置仍由进度驱动（convFactor 不变），运动改由粒子级独立时钟 pt.ft 驱动。
      // 关键：湍流必须叠加在【插值后的最终坐标】上。若加在 wx/wy 上，会被 (tx-wx)*e 在 e→1 时整体吃掉，
      //       等于汇聚后湍流为 0（曾踩此坑：gain 只作用于 sin 项，同样被插值消掉）。故此处只做无漂移的形态项。
      var rate = 0.6 + 0.8 * pt.d;
      var gain = 1 - 0.88 * e;
      pt.ft += dt * (0.55 + 0.45 * pt.d);                 // 无条件推进，与进度无关
      // 姿态：舒展(×1.0) → 屏息(湍流 ×0.45、整体内收 5%) → 绽放(湍流 ×1.9、外扩 10%)
      var tnAmp = (13 + 11 * pt.d) * (1 - 0.55 * tnStall) * (1 + 0.9 * tnPulse);
      var wx = pt.bx + pt.ax * rate * gain * Math.sin(pt.ft * pt.sx * 1.3 + pt.phx);
      var wy = pt.by + pt.ay * rate * gain * Math.cos(pt.ft * pt.sy * 1.3 + pt.phy);
      if (tnStall > 0.02 && e < 0.05) {
        var tnRr = 1 - 0.05 * tnStall;
        wx = cx + (wx - cx) * tnRr; wy = cyWord + (wy - cyWord) * tnRr;
      }
      if (tnPulse > 0.01) {
        var tnBo = 1 + 0.10 * tnPulse;
        wx = cx + (wx - cx) * tnBo; wy = cyWord + (wy - cyWord) * tnBo;
      }
      var tx = cx + pt.trx * pt.shell, ty = cyWord + pt.try * pt.shell;
      var ang = Math.atan2(ty - wy, tx - wx);
      var sw = Math.sin(e * Math.PI) * 24;
      var sxv = Math.cos(ang + Math.PI / 2) * sw, syv = Math.sin(ang + Math.PI / 2) * sw;
      var x = wx + (tx - wx) * e + sxv, y = wy + (ty - wy) * e + syv;
      // 湍流在此叠加（最终坐标层）→ 无论进度停在哪，粒子都在持续流动
      var tnx = (tnNoise(pt.ft * 0.62 + pt.d * 3.1) - 0.5) * 2;
      var tny = (tnNoise(pt.ft * 0.58 + pt.fdx) - 0.5) * 2;
      x += tnx * tnAmp; y += tny * tnAmp;
      x = cx + (x - cx) * breathe; y = cyWord + (y - cyWord) * breathe;
      var pop = 0; if (e > 0.80) { var u = (e - 0.80) / 0.20; pop = Math.sin(u * Math.PI) * 0.08; }
      var ds = pt.size * (0.55 + 0.9 * pt.d) * (1 + pop);
      if (pointer.active) {
        var ddx = x - pointer.x, ddy = y - pointer.y, dd = Math.hypot(ddx, ddy);
        if (dd < REPEL && dd > 0.01) { var rf = (REPEL - dd) / REPEL * 16; x += ddx / dd * rf; y += ddy / dd * rf; }
      }
      var a = pt.aVar * (0.45 + 0.55 * pt.d) * breathA * paMul * gA;
      var aa = clamp(a * (pt.white ? 0.95 : 0.4), 0, 1);
      if (pt.white) {
        ctx.fillStyle = 'rgba(255,255,255,' + aa + ')';
        ctx.beginPath(); ctx.arc(x, y, ds, 0, 7); ctx.fill();
      } else {
        var s2 = ds; ctx.save(); ctx.translate(x, y); ctx.rotate(pt.rot + time * 0.35 * pt.spin);
        ctx.beginPath(); ctx.moveTo(0, -s2); ctx.lineTo(s2 * 0.72, 0); ctx.lineTo(0, s2); ctx.lineTo(-s2 * 0.72, 0); ctx.closePath();
        ctx.fillStyle = 'rgba(0,168,150,' + aa + ')'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,' + clamp(a * 0.5 * gA, 0, 1) + ')'; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(0, -s2); ctx.lineTo(s2 * 0.72, 0); ctx.stroke();
        ctx.restore();
      }
    }

    drawNumber(displayed);

    self.postMessage({ type: 'disp', value: displayed });
    if (dbgChan) { try { dbgChan.postMessage({ t: now, disp: displayed }); } catch (e) {} }

    } catch (e) {
      // 单帧绘制异常（偶发几何/字体问题）不中断动画循环，下一帧继续
    }
    if (running) setTimeout(tick, 16);
  }

  function setTarget(v) {
    v = clamp(v, 0, 100);
    if (v === toVal) return;
    fromVal = displayed; toVal = v; tStart = performance.now(); tDur = STEP_MS;
    lastTargetTime = performance.now();
  }

  function resize(msg) {
    // 🟢 v229.51：几何尽量用传入值，缺失时回退 self（WorkerGlobalScope 有 innerWidth/Height），避免 NaN 致绘制抛错
    var w = (msg && msg.W) || self.innerWidth || 1280;
    var h = (msg && msg.H) || self.innerHeight || 800;
    if (!isFinite(w) || w < 1) w = 1280;
    if (!isFinite(h) || h < 1) h = 800;
    var ringC = h * 0.4905;
    var wordGap = w >= 768 ? 158 : 123;
    W = w; H = h; cx = w / 2; cyWord = ringC - wordGap; cyRing = ringC;
    cyCenter = h * 0.5;            // 内凹盘中心（与原 .boot-center top:50% 对齐）
    if (msg && msg.theme) theme = msg.theme === 'dark' ? 'dark' : 'light';
    dpr = (msg && msg.dpr) || Math.min(self.devicePixelRatio || 1, 2);
    if (cv) {
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  function init(msg) {
    try {
      cv = msg.canvas;
      ctx = cv.getContext('2d');
      if (msg.dbg) { try { dbgChan = new BroadcastChannel('boot-dbg'); } catch (e) { dbgChan = null; } }
      resize(msg);
      buildParticles();
      buildAmbient(W >= 768 ? 130 : 84);
      startTime = performance.now();
      lastTargetTime = startTime;
      lastTick = 0;
      running = true; killed = false;
      tick(performance.now());
    } catch (err) {
      // 初始化失败（极少见：OffscreenCanvas 2d 上下文不可用等）：回传 error，主线程直接淡出，避免空盘卡死
      try { self.postMessage({ type: 'error' }); } catch (e2) {}
    }
  }

  self.onmessage = function (ev) {
    var m = ev.data || {};
    switch (m.type) {
      case 'init': init(m); break;
      case 'resize': resize(m); if (!running) { running = true; tick(performance.now()); } break;
      case 'target': setTarget(m.value); break;
      case 'complete':
        if (completed) break;
        completed = true;
        var el = performance.now() - startTime;
        var wait = Math.max(0, MIN_TIME - el);   // 最小展示时长（worker 端处理）
        setTimeout(function () {
          completeAt = performance.now();
          setTarget(100);
        }, wait);
        break;
      case 'pointer': pointer.x = m.x; pointer.y = m.y; pointer.active = !!m.active; break;
      case 'kill': killed = true; running = false; break;
    }
  };
})();
</script>

<!-- 🟢 v228.53：beacon 统计脚本改为「动态异步注入」。
     旧版（M4）用 defer：defer 脚本会阻塞 DOMContentLoaded，而 App.init()（app.js）也绑在
     DOMContentLoaded 上 —— 一旦 beacon.cdn.qq.com 在用户网络下慢/不可达（DNS 挂起、办公网
     屏蔽、境外链路抖动），启动屏「正在初始化...」会卡住直到请求超时（实测可 30s+）。
     改为动态注入后：① 不再阻塞 DOMContentLoaded，应用秒启；② 加载完成后再上报（数据不丢）；
     ③ 加载失败静默跳过（统计缺失无碍业务）。 -->
  <!-- 🟢 v229.46 AUDIT-F5：移除第三方腾讯 beacon 遥测（原 beacon.cdn.qq.com 动态注入）。
       原因：① 该 SDK 会从 gtimg.cn / myqcloud.com / qq.com 等多个腾讯 CDN 动态加载不透明子脚本并做设备指纹(fp.js)，
             属无法审计的供应链面；② 其 CDN 不返回 CORS 头，SRI 跨域校验在浏览器侧必然失败（已实测 CORS 拦截），
             故「加 SRI」对此 SDK 不可行；③ 向腾讯上报页面元数据且做设备指纹，未经用户同意，违反个保法 §23。
       应用对 beacon 缺失本就优雅降级（onerror 静默跳过），移除不影响任何业务功能。
       如需页面统计：请改用「经用户同意 + 自托管 + 可审计」的分析方案，并按个保法完成告知与单独同意。 -->

    // 若 JS 已接管（started=true），其内部自带 14s 强制收尾，此处不干预。
    setTimeout(function () {
      if (window.__bootSplashStarted) return;
      var el = document.getElementById('bootSplash');
      if (!el || el.style.display === 'none') return;

  <script>
  /* 🟢 v228.57：脚本加载完整性守护 —— 解决「发布网关间歇性 502 → 核心 JS 没下来 →
        App is not defined → 永久白屏」，且用户刷新还可能再撞上同一份坏缓存。
     原理：所有脚本都是 defer 普通脚本，任何一个 502 就整站挂掉且不可自愈。
     做法：DOMContentLoaded 后检查核心对象是否就绪；缺失则自动重载（指数退避，最多 5 次），
           并在重载时带上时间戳 query 绕开 CDN/网关的坏缓存。
     影响：全部正常时这段代码零副作用（检查通过即返回）。 */
  (function () {
    var MAX_RETRY = 5;
    function coreReady() {
      try {
        return typeof window.App !== 'undefined'
            && typeof window.AppConfig !== 'undefined'
            && typeof window.DataStore !== 'undefined'
            && typeof window.SyncManager !== 'undefined';
      } catch (e) { return false; }
    }
    function missing() {
      var m = [];
      try {
        if (typeof window.App === 'undefined') m.push('App');
        if (typeof window.AppConfig === 'undefined') m.push('AppConfig');
        if (typeof window.DataStore === 'undefined') m.push('DataStore');
        if (typeof window.SyncManager === 'undefined') m.push('SyncManager');
      } catch (e) {}
      return m;
    }
    function guard() {
      if (coreReady()) return;
      var n = 0;
      try { n = parseInt(sessionStorage.getItem('wb_boot_retry') || '0', 10) || 0; } catch (e) {}
      if (n >= MAX_RETRY) {
        console.error('[boot-guard] 核心脚本多次加载失败，已停止重试。缺失：' + missing().join(', '));
        try {
          var lt = document.getElementById('loadingText');
          if (lt) lt.textContent = '资源加载失败（' + missing().join('/') + '）：请检查网络后刷新页面';
        } catch (e) {}
        return;
      }
      n += 1;
      try { sessionStorage.setItem('wb_boot_retry', String(n)); } catch (e) {}
      console.warn('[boot-guard] 核心脚本缺失（' + missing().join(', ') + '），第 ' + n + '/' + MAX_RETRY + ' 次自动重载…');
      var delay = Math.min(300 * Math.pow(2, n - 1), 3000);
      setTimeout(function () {
        try {
          var u = new URL(location.href);
          u.searchParams.set('_boot', String(Date.now()));
          location.replace(u.toString());
        } catch (e) { location.reload(); }
      }, delay);
    }
    // DOMContentLoaded 此时 defer 脚本应已全部执行完毕
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(guard, 50);   // 留 50ms 让最后一个 defer 脚本收尾
    });
    // 加载成功后清掉重试计数（避免下次正常启动被历史计数影响）
    window.addEventListener('load', function () {
      setTimeout(function () { if (coreReady()) { try { sessionStorage.removeItem('wb_boot_retry'); } catch (e) {} } }, 200);
    });
  })();
  </script>
  <!-- PWA: 注册 Service Worker（支持离线 + 安装为桌面应用） -->
  <script>
    // 🟢 v229.58：注册 Service Worker（离线 / 安装为桌面应用）。
    // 🟢 v229.74：曾在此处加入「首屏后自动 reload 以应用新版本」逻辑（location.reload）。
    //   实测副作用：每次发版后首次进入（尤其每次进入都是新会话、sessionStorage 闸门失效时）
    //   都会整页刷新一次，表现为「加载页 → 刷新 → 加载页」两次加载页，严重打断体验。
    //   且该功能与 app.js 的 startVersionWatch（周期探测 releases/app-manifest.json 版本号，
    //   发现新版本即滑出「🆕 有新版本，刷新后生效」提示条、点击才刷新）完全冗余。
    // 🟢 v229.76：移除自动 reload。新 SW 安装后仅 skipWaiting + clients.claim 接管后续请求，
    //   不打断当前会话；新版本提示交由 app.js 的 startVersionWatch / _notifyNewVersion 负责
    //   （新 SW 接管时此处会主动唤起一次版本探测提示）。用户点击提示条才刷新，彻底消除两次加载页。
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        // 🟢 v227.21：注册 URL 带版本戳 + updateViaCache:'none'，确保每次发版浏览器都重新拉取 SW 脚本，
        //   避免「改了 CACHE_NAME 但旧 ?v= 被 CDN 缓存、SW 永不更新」的卡死。
        navigator.serviceWorker.register('service-worker.js?v=229.76', { updateViaCache: 'none' }).then(function(reg) {
          console.log('[PWA] Service Worker 注册成功:', reg.scope);
          // 检测到新版本 SW 在等待 → 让它跳过等待并接管，使后续请求走新缓存
          function activateNew() {
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          if (reg.waiting) activateNew();
          reg.addEventListener('updatefound', function () {
            var installing = reg.installing;
            if (!installing) return;
            installing.addEventListener('statechange', function () {
              if (installing.state === 'installed' && navigator.serviceWorker.controller) activateNew();
            });
          });
        }).catch(function(err) {
          console.warn('[PWA] Service Worker 注册失败:', err);
        });
        // 新 SW 接管控制：不打断当前会话，仅记录并唤起一次版本更新提示
        // （app.js 的 _notifyNewVersion 会探测 releases/app-manifest.json，发现新版本即提示用户主动刷新）
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          console.log('[PWA] 新 Service Worker 已接管（下次刷新/访问生效，不打断当前会话）');
          try {
            if (window.App && typeof window.App._notifyNewVersion === 'function') window.App._notifyNewVersion();
          } catch (e) { /* 提示失败不影响主流程 */ }
        });
      });
    }
  </script>
  <!-- 🟢 v229.58：桌面 PWA 单实例 —— 重复启动时聚焦已有窗口并隐藏自身，杜绝「每次点图标都开新窗口」 -->
  <script>
    (function () {
      try {
        var standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
        if (!standalone) return;                       // 普通浏览器标签不限制多开
        if (!('serviceWorker' in navigator)) return;
        function enforce() {
          var sw = navigator.serviceWorker;
          if (!sw.controller) return;                  // 等 SW 接管本页后再判断
          var ch = new MessageChannel();
          ch.port1.onmessage = function (ev) {
            var count = ev.data && ev.data.count;
            if (count && count > 1) {                  // 已有窗口存在 → 聚焦它 + 收掉当前重复窗口
              try { sw.controller.postMessage({ type: 'FOCUS_EXISTING' }); } catch (e) {}
              try { document.documentElement.style.display = 'none'; } catch (e) {}
              setTimeout(function () { try { window.close(); } catch (e) {} }, 200);
            }
          };
          try { sw.controller.postMessage({ type: 'COUNT_CLIENTS' }, [ch.port2]); } catch (e) {}
        }
        navigator.serviceWorker.ready.then(function () {
          if (navigator.serviceWorker.controller) enforce();
          else navigator.serviceWorker.addEventListener('controllerchange', enforce, { once: true });
        });
      } catch (e) {}
    })();
  </script>

  <!-- 源代码保护（基础防护：禁用右键/F12/查看源码快捷键 + 控制台水印） -->
  <script>
    (function () {
      // 1. 禁用右键菜单
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });

      // 2. 禁用常见调试/查看源码快捷键
      document.addEventListener('keydown', function (e) {
        // F12
        if (e.key === 'F12') { e.preventDefault(); return; }
        // Ctrl+Shift+I / J / C / K（开发者工具）
        if (e.ctrlKey && e.shiftKey && ['I','J','C','K'].includes(e.key.toUpperCase())) {
          e.preventDefault(); return;
        }
        // Ctrl+U（查看源代码）
        if (e.ctrlKey && e.key.toUpperCase() === 'U') { e.preventDefault(); return; }
        // Ctrl+S（保存页面）
        if (e.ctrlKey && e.key.toUpperCase() === 'S') { e.preventDefault(); return; }
      });

      // 3. 禁止文本选择（防简单复制）
      //    🟢 v228.80 修复：selectstart 的 e.target 在纯文本单元格里是「文本节点(Text)」，
      //       它**没有 closest 方法**；原判断 `e.target.closest && e.target.closest('.data-table')`
      //       对文本节点恒为 falsy，导致表格内拖选被误拦、无法复制。
      //       修复：若 target 是文本节点，先归一化到其父元素再判断。
      document.addEventListener('selectstart', function (e) {
        var el = e.target;
        if (el && el.nodeType === 3) el = el.parentElement; // 文本节点 → 父元素
        if (!el) return;
        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
        // 允许在数据表格内选择
        if (el.closest && el.closest('.data-table')) return;
        e.preventDefault();
      });

      // 4. 控制台水印（含版本号）
      //    🟢 v228.18 附带修复：本脚本是**内联非 defer**脚本，会先于带 defer 的 config.js 执行，
      //    此处直接读 AppConfig 必然是 undefined，导致水印永远显示「v???」。
      //    改为等到 DOMContentLoaded（defer 脚本已全部执行完）后再取真实版本号并打印。
      const _printBanner = function () {
        const _ver = (window.AppConfig && AppConfig.app && AppConfig.app.version) || 'v???';
        const banner = '\n%c🔒 库管系统工作台 · ' + _ver + ' · 源码受保护\n%c本应用为内部使用版本。未经授权，禁止复制、分发或反编译源码。\n© Warehouse Workbench · All Rights Reserved\n';
        console.log(banner, 'color:#3b82f6;font-size:18px;font-weight:bold;padding:4px 0;', 'color:#64748b;font-size:12px;');
        console.log('%c当前版本：' + _ver + '  ·  如需正式授权或技术支持，请联系管理员。', 'color:#94a3b8;font-size:11px;font-style:italic;');
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', _printBanner);
      } else {
        _printBanner();
      }
    })();
  </script>

      // 这样以后新增任何文件，无需手动更新 SOURCE_FILES.json，下载的源码包都会自动包含。
      // 仅当服务器不支持目录列表（如 GitHub Pages）时，才回退到 SOURCE_FILES.json / 内置清单。
      var SCAN_ROOTS = ['js', 'lib', 'css', 'icons', 'bridge', 'docs', 'assets'];
      var SKIP_DIRS  = new Set(['node_modules', '.git', 'tools', 'releases']);
      var ROOT_FILES = ['index.html', 'manifest.json', 'service-worker.js',
                        '.gitignore', '.gitlab-ci.yml', '.nojekyll', 'SOURCE_FILES.json',
                        '.github/workflows/deploy.yml', 'releases/app-manifest.json'];
      // 排除「根目录级别」的临时报告/草稿（如 全局代码审查报告_v227.50.md、UI优化方案.md 等），
      // 但【保留 docs/ 与 bridge/ 下的文档】——含《全局代码审查标准.md》及 bridge 的 README/集成说明。
      // 参数传相对路径（含目录），以区分根级垃圾与子目录里的正式文档。
      // 🟢 v229.56：堵住预览/提案/对比稿漏入 —— 此前仅挡 *_preview.html 后缀，
      //   docs/ 下中文命名预览（*预览*.html、*提案*.html）、*-compare.html 及任意位置的 preview
      //   均会被「自愈补入 / 目录扫描回退」塞进下载包。
      function _isDevJunk(relPath) {
        var base = relPath.indexOf('/') >= 0 ? relPath.split('/').pop() : relPath;
        if (/^(dp-|settings-verify)/.test(base) || /preview/i.test(base)) return true;
        if (/预览|提案/.test(base)) return true;
        // docs/ 下的 HTML 全部是方案预览/提案/对比稿等开发期产物（运行时不引用任何 docs/*.html）→ 一律不进包
        if (/^docs\//.test(relPath) && /\.html?$/i.test(base)) return true;
        // 仅当 .md 位于仓库根目录时才视为垃圾；docs/、bridge/ 下的 .md 一律保留
        if (base.endsWith('.md') && relPath.indexOf('/') === -1) return true;
        return false;
      }
      // 仅在「目录扫描」路径下排除无用图片：保留 manifest 引用的 PWA 图标
      // (icons/icon-<size>.png|svg)，排除设计稿/预览/截图/草稿类图片（如 icon-design.svg）。
      function _isUselessImage(name) {
        var lower = name.toLowerCase();
        if (!/\.(png|jpe?g|gif|webp|svg)$/.test(lower)) return false;
        return /\bdesign\b|preview|screenshot|_bak|mock|draft|tmp|^v\d/i.test(lower);
      }
      async function _listDirEntries(relDir) {
        try {
          var resp = await fetch(relDir + (relDir.endsWith('/') ? '' : '/') + '?_=' + Date.now());
          if (!resp.ok) return null;
          var html = await resp.text();
          var out = [], re = /<a\s+href="([^"]+)"/gi, m;
          while ((m = re.exec(html))) {
            var h = decodeURIComponent(m[1]);
            if (h === '../' || h.charAt(0) === '/' || /^https?:/i.test(h)) continue;
            out.push(h);
          }
          return out;
        } catch (e) { return null; }
      }
      async function _scanRecursive(relDir) {
        var entries = await _listDirEntries(relDir);
        if (!entries) return [];
        var files = [], base = relDir === '' ? '' : relDir + '/';
        for (var i = 0; i < entries.length; i++) {
          var e = entries[i];
          if (e.charAt(e.length - 1) === '/') {
            var dirName = e.slice(0, -1);
            if (SKIP_DIRS.has(dirName) || dirName.charAt(0) === '.') continue;
            files = files.concat(await _scanRecursive(base + dirName));
          } else {
            if (e.charAt(0) === '.' || _isDevJunk(base + e) || _isUselessImage(e)) continue;
            files.push(base + e);
          }
        }
        return files;
      }
      async function scanSourceDirs() {
        var files = [];
        for (var i = 0; i < SCAN_ROOTS.length; i++) {
          files = files.concat(await _scanRecursive(SCAN_ROOTS[i]));
        }
        files = files.concat(ROOT_FILES);
        return files;
      }
      // 两份必备文档：任何回退路径都强制纳入，避免被目录扫描的 _isDevJunk 把根级 .md（纪律文档）误剔
      var REQUIRED_DOCS = ['docs/全局代码审查标准.md', '修复与发布纪律_v227.92.md'];

      async function buildPackageList() {
        // 🟢 v228.03 修复：优先用 package-source.mjs 生成的权威清单 SOURCE_FILES.json，
        // 它与「源码下载」交付包完全一致（全部代码 + 两份文档 + 有用图标，其余剔除）。
        // 不再优先目录扫描——目录扫描在部分托管可用，但会把根级 .md（纪律文档）误剔，导致下载缺文档。
        var sl = await loadFileList();
        if (sl && sl.length) {
          // 🟢 v228.66 纪律自愈：权威清单可能因「新增文件后忘记重跑 tools/gen-source-list.mjs」而漂移，
          // 这里实时比对目录扫描，把磁盘上有但清单漏掉的文件补进包，避免源码下载静默缺文件。
          try {
            var _disk = await scanSourceDirs();
            if (_disk && _disk.length) {
              var _set = new Set(sl);
              var _miss = [];
              for (var _i = 0; _i < _disk.length; _i++) {
                var _f = _disk[_i];
                if (_set.has(_f)) continue;
                if (_f.endsWith('.md')) continue;  // 🟢 v228.66：md 由清单精确控制，不参与自愈补入
                _miss.push(_f);
              }
              if (_miss.length) {
                console.warn('[download] 清单 SOURCE_FILES.json 缺失 ' + _miss.length + ' 个文件，已自愈补入（请重跑 tools/gen-source-list.mjs 同步清单）：' + _miss.slice(0, 12).join('、'));
                sl = sl.concat(_miss);
              }
            }
          } catch (e) { /* 扫描失败不影响主路径 */ }
          console.log('[download] 使用权威清单 SOURCE_FILES.json，共 ' + sl.length + ' 个文件');
          return sl;
        }
        // 回退①：动态目录扫描（实时），强制补入两份必备文档
        try {
          var dyn = await scanSourceDirs();
          if (dyn && dyn.length) {
            for (var k = 0; k < REQUIRED_DOCS.length; k++) {
              if (dyn.indexOf(REQUIRED_DOCS[k]) === -1) dyn.push(REQUIRED_DOCS[k]);
            }
            console.log('[download] 目录扫描回退，共 ' + dyn.length + ' 个文件（已补入两份必备文档）');
            return dyn;
          }
        } catch (e) { console.warn('[download] 目录扫描失败', e.message); }
        // 回退②：内置硬编码清单（同样补入两份文档）
        var fb = FILES_TO_PACKAGE.slice();
        for (var m = 0; m < REQUIRED_DOCS.length; m++) {
          if (fb.indexOf(REQUIRED_DOCS[m]) === -1) fb.push(REQUIRED_DOCS[m]);
        }
        return fb;
      }
      // 权威清单：由 tools/gen-source-list.mjs 扫描生成，作为目录列表不可用时的回退。
      async function loadFileList() {
        try {
          const resp = await fetch('SOURCE_FILES.json?' + new Date().getTime()); // 加时间戳防止缓存
          if (!resp.ok) return null;
          const list = await resp.json();
          if (Array.isArray(list) && list.length) {
            console.log('[download] 使用权威清单 SOURCE_FILES.json，共 ' + list.length + ' 个文件');
            return list;
          }
        } catch (e) {
          console.warn('[download] 读取 SOURCE_FILES.json 失败，回退内置清单', e.message);
        }
        return null;
      }

      // CDN 通常屏蔽以 . 开头的文件(返回403)，内嵌其内容作为兜底
      var DOTFILE_FALLBACKS = {
        '.gitignore': '# OS / editor junk\n.DS_Store\nThumbs.db\n*.swp\n\n# Node (not used, but safe)\nnode_modules/\n\n# Local-only / large working assets not needed for the live site\nscreenshots/\n\n# 旧的静态源码包（已被动态打包取代，且含修复前的旧代码，禁止再提交/发布）\nsource-code.zip\n',
        '.github/workflows/deploy.yml': 'name: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: github-pages\n  cancel-in-progress: true\n\njobs:\n  deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Pages\n        uses: actions/configure-pages@v5\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: .\n\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n',
        '.gitlab-ci.yml': '# GitLab Pages 部署配置 —— 把静态文件发布为网站\npages:\n  stage: deploy\n  script:\n    - echo "静态站点，无需构建，直接发布"\n  artifacts:\n    paths:\n      - .\n    expire_in: 1 day\n  rules:\n    - if: $CI_COMMIT_BRANCH == "main"\n',
        '.nojekyll': ''
      };

      // 动态打包：逐个 fetch 当前线上文件 → JSZip 压缩 → 触发下载
      async function doDynamicDownload() {
        // 🟢 v228.08：JSZip 改为按需加载（不再由 index.html 预载），首次打包时才动态拉取，
        //   降低首屏下载/解析量。加载期间显示提示，失败给出明确错误（不牺牲体验）。
        if (typeof LazyLib !== 'undefined' && !LazyLib.has('jszip')) {
          try {
            if (typeof showLoading === 'function') showLoading('正在加载打包组件...', { progress: 0 });
            await LazyLib.jszip();
          } catch (err) {
            if (typeof hideLoading === 'function') hideLoading();
            error.textContent = '打包组件加载失败，请检查网络后重试';
            return;
          }
        }
        var JSZip = window.JSZip;   // 局部引用，供下方 new JSZip() 使用
        if (typeof JSZip === 'undefined') {
          error.textContent = 'JSZip 库未加载，请刷新页面后重试';
          return;
        }
        const baseList = await buildPackageList();
        // dotfile（.github/.gitignore/.gitlab-ci.yml/.nojekyll）在部分 CDN 会被屏蔽(403)，
        // 用内嵌兜底内容写入，确保无论用哪种清单都能齐全，不被遗漏。
        const dotKeys = Object.keys(DOTFILE_FALLBACKS);
        const fileList = baseList.concat(dotKeys.filter(function (k) {
          return baseList.indexOf(k) === -1;
        }));
        overlay.classList.remove('show');
        showLoading('正在打包源代码（' + fileList.length + ' 个文件）...', { progress: 0 });

        var zip = new JSZip();
        var fetched = 0;
        var total  = fileList.length;

        Promise.all(fileList.map(function (path) {
          // 🟢 v228.03 修复：加时间戳破坏缓存，确保 CDN / Service Worker 永远返回最新文件，
          // 否则可能下载到「戳新文件旧」的旧 data-loader.js（恢复上一份/云端恢复按钮未合并）。
          var url = path + (path.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
          return fetch(url).then(function (resp) {
            if (!resp.ok) {
              // dotfile 被 CDN 屏蔽(403)时，使用内嵌兜底内容
              if (resp.status === 403 && DOTFILE_FALLBACKS[path]) {
                zip.file(path, DOTFILE_FALLBACKS[path]);
                fetched++;
                showLoading('正在打包... (' + fetched + '/' + total + ')', { progress: Math.round(fetched / total * 100) });
                return;
              }
              throw new Error(path + ': HTTP ' + resp.status);
            }
            return resp.blob().then(function (blob) {
              zip.file(path, blob);
              fetched++;
              showLoading('正在打包... (' + fetched + '/' + total + ')', { progress: Math.round(fetched / total * 100) });
            });
          }).catch(function (err) {
            console.warn('[download] 跳过文件:', path, err.message);
            fetched++;
          });
        })).then(function () {
          return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } },
            function (metadata) {
              showLoading('正在压缩... ' + Math.round(metadata.percent) + '%', { progress: Math.round(metadata.percent) });
            });
        }).then(function (blob) {
          hideLoading();
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          // 🟢 v228.95：压缩包命名由「日期」改为「版本号」，与发布版本一致，便于追溯
          var _verNum = (window.AppConfig && AppConfig.app && AppConfig.app.version) || 'v???';
          _verNum = String(_verNum).replace(/^v/i, '');  // 去掉前导 v，避免文件名出现双 v
          a.download = 'warehouse-workbench-source-v' + _verNum + '.zip';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
          console.log('[download] 源代码打包完成 (' + fetched + '/' + total + ' 文件)');
        }).catch(function (err) {
          hideLoading();
          console.error('[download] 打包失败:', err);
          alert('打包失败: ' + (err.message || err));
        });
      }

      // 🟢 v227.35：源码下载统一纳入管理员权限（与「数据导入 / 设置」一致，使用同一管理员密码校验）
      // 🟢 v227.39：4 个系统入口统一改为按权限放行（不再强制要求管理员特权；keeper 单独勾选「源码」权限即可）
      window.__startSourceDownload = doDynamicDownload;
      document.getElementById('sourceDownloadBtn').addEventListener('click', function (e) {
        e.preventDefault();
        if (typeof App !== 'undefined' && App.openSourceEntry) {
          App.openSourceEntry();
        } else {
          doDynamicDownload();
        }
      });
    })();
  </script>
</body>
</html>
